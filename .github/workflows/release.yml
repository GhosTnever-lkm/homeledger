name: Create release archive

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p dist
          zip -r dist/HomeLedger-${GITHUB_REF_NAME}.zip . -x '.git/*' 'dist/*'
          sha256sum dist/HomeLedger-${GITHUB_REF_NAME}.zip > dist/HomeLedger-${GITHUB_REF_NAME}.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "HomeLedger $GITHUB_REF_NAME" --notes-file CHANGELOG.md
